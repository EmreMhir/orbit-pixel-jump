name: orbit_jump
description: A neon one-tap orbital arcade game.
publish_to: none
version: 1.0.3+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.2
  google_mobile_ads: 9.1.0
  shared_preferences: 2.5.5
  flame_audio: 2.12.2
  url_launcher: 6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/privacy_tr.txt
  fonts:
    # Flutter web's default fallback also resolves locally.
    - family: Roboto
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
